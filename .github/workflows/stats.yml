name: Update GitHub Stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PYEOF'
          import json, os, re, urllib.request
          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              "https://api.github.com/users/qgeng1465/repos?per_page=100",
              headers={"Authorization": "token " + token, "Accept": "application/vnd.github.v3+json"}
          )
          repos = json.load(urllib.request.urlopen(req))
          stars = sum(r["stargazers_count"] for r in repos)
          forks = sum(r["forks_count"] for r in repos)
          readme = open("README.md").read()
          readme = re.sub(r"Total%20Stars-\d+", f"Total%20Stars-{stars}", readme)
          readme = re.sub(r"Total%20Forks-\d+", f"Total%20Forks-{forks}", readme)
          open("README.md", "w").write(readme)
          print(f"Updated: {stars} stars, {forks} forks")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "qgeng1465"
          git config user.email "qgeng1465@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update GitHub stars and forks" && git push origin HEAD:main)
